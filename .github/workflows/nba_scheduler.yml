name: NBA Standings Update

on:
  schedule:
    # רץ כל 15 דקות
    - cron: '*/15 * * * *'
  workflow_dispatch: # מאפשר להריץ ידנית לבדיקה

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests supabase

      - name: Run Update Script
        env:
            # Map the existing GitHub secrets to the expected VITE variables
            VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY }}
            END_DATE: "2026-04-15" 
            START_HOUR_UTC: 0
            END_HOUR_UTC: 10
        run: python scripts/main.py