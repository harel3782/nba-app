name: NBA Standings Update

on:
  schedule:
    # רץ כל 15 דקות
    - cron: '*/15 * * * *'
  workflow_dispatch: # מאפשר להריץ ידנית לבדיקה

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests supabase

      - name: Run Update Script
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # הגדר פה את תאריך הסיום (למשל סוף העונה הרגילה)
          END_DATE: "2026-04-15" 
          # הגדר את טווח השעות (לפי שעון UTC - שים לב להפרשי השעות מישראל)
          START_HOUR_UTC: 0  # 2:00 בלילה שעון ישראל
          END_HOUR_UTC: 10   # 12:00 בצהריים שעון ישראל
        run: python scripts/main.py